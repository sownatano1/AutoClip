name: AutoClip - Fila de vídeos

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: "Até 30 links do YouTube; separe por espaço, vírgula ou nova linha"
        required: true
        type: string
      rights_confirmed:
        description: "Confirmo que tenho direito/permissão para reutilizar estes conteúdos"
        required: true
        default: false
        type: boolean
      clips:
        description: "Quantidade de cortes por vídeo"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      whisper_model:
        description: "Modelo Whisper"
        required: true
        default: "base"
        type: choice
        options:
          - base
          - tiny
      subtitle_language:
        description: "Idioma da legenda"
        required: true
        default: "English"
        type: choice
        options:
          - English
          - "Português (Brasil)"
          - "Idioma original"
      content_profile:
        description: "Perfil do conteúdo"
        required: true
        default: "Auto"
        type: choice
        options:
          - Auto
          - "Podcast/Entrevista"
          - "Talking Head"
          - Gameplay
          - "Filme/Série"
      show_context_hook:
        description: "Mostrar hook contextual no topo?"
        required: true
        default: true
        type: boolean
      hook_duration_seconds:
        description: "Duração do hook no topo em segundos"
        required: true
        default: "8"
        type: string
      natural_loop:
        description: "Preferir loop natural quando funcionar?"
        required: true
        default: true
        type: boolean
      visual_attention_engine:
        description: "Ativar Visual Attention Engine?"
        required: true
        default: true
        type: boolean
      smart_split_screen:
        description: "Usar split-screen inteligente?"
        required: true
        default: true
        type: boolean
      reaction_emphasis:
        description: "Dar ênfase visual a reações fortes?"
        required: true
        default: true
        type: boolean
      auto_review:
        description: "Ativar Auto Review?"
        required: true
        default: true
        type: boolean
      create_cover:
        description: "Criar capa automática?"
        required: true
        default: true
        type: boolean
      cover_style:
        description: "Estilo da capa"
        required: true
        default: "Auto"
        type: choice
        options:
          - Auto
          - Clean
          - Bold
          - Cinematic
      cover_duration_seconds:
        description: "Tempo da capa no início"
        required: true
        default: "0.8"
        type: string
      publish_to_buffer:
        description: "Enviar os cortes ao Buffer/TikTok?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare_queue:
    name: Preparar fila
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - name: Validar e montar fila
        id: queue
        shell: bash
        env:
          URLS_INPUT: ${{ inputs.youtube_urls }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          raw = os.environ.get("URLS_INPUT", "").strip()
          parts = [x.strip() for x in re.split(r"[\s,;]+", raw) if x.strip()]
          urls = []
          invalid = []
          seen = set()

          for value in parts:
              valid = value.startswith(("https://", "http://")) and (
                  "youtube.com/" in value or "youtu.be/" in value
              )
              if not valid:
                  invalid.append(value)
                  continue
              if value not in seen:
                  seen.add(value)
                  urls.append(value)

          if invalid:
              raise SystemExit("Link(s) inválido(s): " + ", ".join(invalid[:5]))
          if not urls:
              raise SystemExit("Nenhum link do YouTube foi encontrado.")
          if len(urls) > 30:
              raise SystemExit(f"Máximo de 30 vídeos por fila; recebidos: {len(urls)}")

          matrix = {
              "include": [
                  {"index": index, "url": url}
                  for index, url in enumerate(urls, start=1)
              ]
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              fh.write(f"count={len(urls)}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"## Fila AutoClip\n\n**{len(urls)} vídeo(s)** adicionados. Processamento sequencial: **1 por vez**.\n\n")
              for index, url in enumerate(urls, start=1):
                  fh.write(f"{index}. `{url}`\n")
          PY

  queue:
    name: Vídeo ${{ matrix.index }}/${{ needs.prepare_queue.outputs.count }}
    needs: prepare_queue
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare_queue.outputs.matrix) }}
    uses: ./.github/workflows/process-video.yml
    with:
      queue_token: ${{ format('queue-{0}-{1}', github.run_id, matrix.index) }}
      youtube_url: ${{ matrix.url }}
      rights_confirmed: ${{ inputs.rights_confirmed }}
      clips: ${{ inputs.clips }}
      whisper_model: ${{ inputs.whisper_model }}
      subtitle_language: ${{ inputs.subtitle_language }}
      content_profile: ${{ inputs.content_profile }}
      show_context_hook: ${{ inputs.show_context_hook }}
      hook_duration_seconds: ${{ inputs.hook_duration_seconds }}
      natural_loop: ${{ inputs.natural_loop }}
      visual_attention_engine: ${{ inputs.visual_attention_engine }}
      smart_split_screen: ${{ inputs.smart_split_screen }}
      reaction_emphasis: ${{ inputs.reaction_emphasis }}
      auto_review: ${{ inputs.auto_review }}
      create_cover: ${{ inputs.create_cover }}
      cover_style: ${{ inputs.cover_style }}
      cover_duration_seconds: ${{ inputs.cover_duration_seconds }}
      publish_to_buffer: ${{ inputs.publish_to_buffer }}
    secrets: inherit
