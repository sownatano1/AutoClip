name: AutoClip - Publicar backlog

on:
  workflow_dispatch:
  schedule:
    # São Paulo (UTC-3): ~10 min depois dos slots 12:00, 18:00 e 22:00.
    - cron: "10 1,15,21 * * *"

concurrency:
  group: autoclips-backlog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      AUTOCLIP_BACKLOG_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências mínimas
        run: python -m pip install requests "cryptography>=43,<46"

      - name: Validar publicador
        run: python -m py_compile publish_backlog.py autoclip.py

      - name: Preencher vagas do Buffer com o backlog
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOCLIP_BACKLOG_ENCRYPTION_KEY: ${{ secrets.AUTOCLIP_BACKLOG_ENCRYPTION_KEY }}
        run: python publish_backlog.py --drain
