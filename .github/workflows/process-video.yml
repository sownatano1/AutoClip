name: AutoClip - Processar vídeo

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Link do YouTube"
        required: true
        type: string
      rights_confirmed:
        description: "Confirmo que tenho direito/permissão para reutilizar este conteúdo"
        required: true
        default: false
        type: boolean
      clips:
        description: "Quantidade de cortes"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      whisper_model:
        description: "Modelo Whisper (base = recomendado; tiny = teste rápido)"
        required: true
        default: "base"
        type: choice
        options:
          - base
          - tiny
      subtitle_language:
        description: "Idioma da legenda"
        required: true
        default: "English"
        type: choice
        options:
          - English
          - "Português (Brasil)"
          - "Idioma original"
      content_profile:
        description: "Perfil do conteúdo (Auto tenta detectar sozinho)"
        required: true
        default: "Auto"
        type: choice
        options:
          - Auto
          - "Podcast/Entrevista"
          - "Talking Head"
          - Gameplay
          - "Filme/Série"
      show_context_hook:
        description: "Mostrar hook contextual no topo?"
        required: true
        default: true
        type: boolean
      hook_duration_seconds:
        description: "Duração do hook no topo em segundos (1–15)"
        required: true
        default: "8"
        type: string
      natural_loop:
        description: "Preferir final que faça loop natural quando isso funcionar?"
        required: true
        default: true
        type: boolean
      visual_attention_engine:
        description: "Ativar Visual Attention Engine para evitar trechos visualmente parados?"
        required: true
        default: true
        type: boolean
      smart_split_screen:
        description: "Usar split-screen quando falante e reação forem relevantes?"
        required: true
        default: true
        type: boolean
      reaction_emphasis:
        description: "Dar close curto em reações fortes antes de voltar ao falante?"
        required: true
        default: true
        type: boolean
      auto_review:
        description: "Revisar o clipe final e corrigir automaticamente problemas detectados?"
        required: true
        default: true
        type: boolean
      create_cover:
        description: "Criar capa/thumbnail automática?"
        required: true
        default: true
        type: boolean
      cover_style:
        description: "Estilo da capa"
        required: true
        default: "Auto"
        type: choice
        options:
          - Auto
          - Clean
          - Bold
          - Cinematic
      cover_duration_seconds:
        description: "Tempo que a capa aparece no início (0.3–2.0 s)"
        required: true
        default: "0.8"
        type: string
      publish_to_buffer:
        description: "Enviar os cortes ao Buffer/TikTok? (deixe desmarcado enquanto estivermos testando)"
        required: true
        default: false
        type: boolean

concurrency:
  group: autoclips-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      YOUTUBE_URL: ${{ inputs.youtube_url }}
      RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
      CLIPS_PER_SOURCE: ${{ inputs.clips }}
      WHISPER_MODEL: ${{ inputs.whisper_model }}
      SUBTITLE_LANGUAGE: ${{ inputs.subtitle_language }}
      CONTENT_PROFILE: ${{ inputs.content_profile }}
      SHOW_CONTEXT_HOOK: ${{ inputs.show_context_hook }}
      HOOK_DURATION_SECONDS: ${{ inputs.hook_duration_seconds }}
      NATURAL_LOOP: ${{ inputs.natural_loop }}
      VISUAL_ATTENTION_ENGINE: ${{ inputs.visual_attention_engine }}
      SMART_SPLIT_SCREEN: ${{ inputs.smart_split_screen }}
      REACTION_EMPHASIS: ${{ inputs.reaction_emphasis }}
      AUTO_REVIEW: ${{ inputs.auto_review }}
      CREATE_COVER: ${{ inputs.create_cover }}
      COVER_STYLE: ${{ inputs.cover_style }}
      COVER_DURATION_SECONDS: ${{ inputs.cover_duration_seconds }}
      AUTO_PUBLISH: ${{ inputs.publish_to_buffer }}
      MIN_CLIP_SECONDS: "25"
      MAX_CLIP_SECONDS: "150"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_FOLDER: ${{ vars.CLOUDINARY_FOLDER || 'autoclips' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      YOUTUBE_COOKIES_FILE: ${{ github.workspace }}/youtube-cookies.txt
      YOUTUBE_POT_PROVIDER_URL: http://127.0.0.1:4416

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ runner.os }}-${{ inputs.whisper_model }}

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Validar Cloudinary antes do processamento
        shell: bash
        run: |
          test -n "$CLOUDINARY_CLOUD_NAME"
          test -n "$CLOUDINARY_API_KEY"
          test -n "$CLOUDINARY_API_SECRET"
          curl --fail --silent --show-error \
            --user "$CLOUDINARY_API_KEY:$CLOUDINARY_API_SECRET" \
            "https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/ping" >/dev/null
          echo "Cloudinary: OK"

      - name: Validar Buffer e canal TikTok
        if: ${{ inputs.publish_to_buffer }}
        shell: bash
        run: |
          python - <<'PY'
          import autoclip
          try:
              channel = autoclip.BufferClient().channel_id()
          except Exception as exc:
              raise SystemExit(f"Buffer/TikTok não validado: {exc}")
          if not channel:
              raise SystemExit("Buffer/TikTok não validado: nenhum canal TikTok conectado foi encontrado")
          print("Buffer/TikTok: OK")
          PY

      - name: Verificar runtime JavaScript do YouTube
        shell: bash
        run: |
          command -v node
          node --version
          python - <<'PY'
          import yt_dlp
          try:
              import yt_dlp_ejs
              print("yt-dlp-ejs: OK")
          except Exception as exc:
              raise SystemExit(f"yt-dlp-ejs não disponível: {exc}")
          print("yt-dlp:", yt_dlp.version.__version__)
          PY

      - name: Iniciar PO Token Provider do YouTube
        shell: bash
        run: |
          docker run --rm -d --name autoclips-pot-provider \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          sleep 3
          docker ps --filter name=autoclips-pot-provider

      - name: Preparar sessão do YouTube
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        shell: bash
        run: |
          printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$YOUTUBE_COOKIES_FILE"
          chmod 600 "$YOUTUBE_COOKIES_FILE"
          test -s "$YOUTUBE_COOKIES_FILE"
          echo "Cookies do YouTube preparados com segurança."

      - name: Validar sessão do YouTube antes do processamento
        env:
          YOUTUBE_PREFLIGHT_ONLY: "true"
        run: python runner.py

      - name: Validar configuração
        run: python autoclip.py --check

      - name: Processar vídeo com Quality v9.7 + Social Caption + Camera Director + Auto Review
        run: python runner.py

      - name: Limpar sessão temporária do YouTube
        if: ${{ always() }}
        run: rm -f "$YOUTUBE_COOKIES_FILE"

      - name: Encerrar PO Token Provider
        if: ${{ always() }}
        run: docker rm -f autoclips-pot-provider 2>/dev/null || true
