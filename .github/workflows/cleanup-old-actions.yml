name: AutoClip - Limpar Actions antigos

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite DELETE_OLD_RUNS para confirmar"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'DELETE_OLD_RUNS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUTOFF: "2026-09-20T16:10:00Z"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Excluir runs anteriores ao endurecimento público
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          cutoff = os.environ["CUTOFF"]
          current_run = int(os.environ["GITHUB_RUN_ID"])

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AutoClip-actions-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return json.loads(raw.decode("utf-8")) if raw else None

          old_runs = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}"
              data = request(url) or {}
              runs = data.get("workflow_runs") or []
              if not runs:
                  break

              for run in runs:
                  run_id = int(run.get("id") or 0)
                  created = str(run.get("created_at") or "")
                  if run_id and run_id != current_run and created and created < cutoff:
                      old_runs.append((run_id, created, run.get("name") or ""))

              if len(runs) < 100:
                  break
              page += 1

          print(f"Cutoff: {cutoff}")
          print(f"Runs antigos encontrados: {len(old_runs)}")

          deleted = 0
          failed = []
          for run_id, created, name in old_runs:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              try:
                  request(url, method="DELETE")
                  deleted += 1
                  print(f"DELETED {run_id} | {created} | {name}")
              except urllib.error.HTTPError as exc:
                  failed.append((run_id, exc.code))
                  print(f"FAILED {run_id} | HTTP {exc.code}", file=sys.stderr)
              time.sleep(0.08)

          print(f"Excluídos: {deleted}")
          if failed:
              print(f"Falhas: {failed}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Resumo
        if: ${{ always() }}
        run: |
          echo "## Limpeza de Actions" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Runs anteriores a **2026-09-20 16:10 UTC** foram alvo da limpeza." >> "$GITHUB_STEP_SUMMARY"
          echo "O próprio run de limpeza e todos os runs posteriores ao cutoff são preservados." >> "$GITHUB_STEP_SUMMARY"
